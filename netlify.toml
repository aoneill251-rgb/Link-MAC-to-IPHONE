# Timeless Café — pass-through (must be before the catch-all below)
[[redirects]]
  from = "/timeless-cafe"
  to = "/timeless-cafe/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/timeless-cafe/*"
  to = "/timeless-cafe/:splat"
  status = 200
  force = false

# H5 Hair SPA catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; frame-src https://www.google.com;"
