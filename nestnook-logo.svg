<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- Nest icon -->
  <g transform="translate(12, 8)">
    <!-- Nest base arc -->
    <path d="M 8 62 Q 40 78 72 62" stroke="#C8603A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Left twig -->
    <path d="M 8 62 Q 2 44 18 36" stroke="#C8603A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Right twig -->
    <path d="M 72 62 Q 78 44 62 36" stroke="#C8603A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Inner nest line -->
    <path d="M 18 58 Q 40 68 62 58" stroke="#C8603A" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Three eggs -->
    <circle cx="30" cy="40" r="7" fill="#E8956D"/>
    <circle cx="40" cy="34" r="7.5" fill="#C8603A"/>
    <circle cx="50" cy="40" r="7" fill="#E8956D"/>
    <!-- Shine on middle egg -->
    <circle cx="37" cy="31" r="2" fill="white" opacity="0.4"/>
  </g>

  <!-- NestNook wordmark -->
  <text x="105" y="66"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="48"
    font-weight="700"
    fill="#2C2420"
    letter-spacing="-0.5">Nest</text>
  <text x="228" y="66"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="48"
    font-weight="400"
    fill="#C8603A"
    letter-spacing="-0.5">Nook</text>

  <!-- Tagline -->
  <text x="106" y="84"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    fill="#888880"
    letter-spacing="3.5"
    font-weight="400">SMART KITCHEN GADGETS</text>
</svg>
